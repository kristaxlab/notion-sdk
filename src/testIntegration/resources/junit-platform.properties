# Notion coordinates the integration tests run against.
#
# Every setting below can also be supplied as an environment variable (see
# io.kristaxlab.notion.NotionTestEnvironmentConstants) or on the command line, e.g.
#   ./gradlew testIntegration -Dnotion.test.page-id=<page id>
#
# Page all test data is created under; NOTION_TEST_PAGE_ID
#notion.test.page-id=
#
# Database new test session pages are created in; NOTION_TEST_DATABASE_ID.
# Defaults to the child database of the page above titled as configured below.
#notion.test.database-id=
#
# Title of that child database; NOTION_TEST_DATABASE_NAME
notion.tests.session.title=Notion: Integration Tests
notion.tests.session.parent.id=337cd6cf-1406-80be-b839-d74142f3ebf4
# notion.tests.session.template.id=3aacd6cf140680f98d43c3fbc9ffba77

# TODO see if this sam problem occures with concurrent writes to data sources
# note: concurrent execution may cause "conflict" (409) error response from Notion API
# because currently majority of tests create a new page on a test root page (concurrent writes to the same page).
#junit.jupiter.execution.parallel.enabled=true
#junit.jupiter.execution.parallel.mode.default=concurrent
#junit.jupiter.execution.parallel.mode.classes.default=concurrent

#
# When enabled, tests without prerequisites run directly on the test session page instead of
# getting a dedicated page each. Tests with a prefilled prerequisite page (a child page named
# after the test id, ex. IT-123) still resolve to that page. Do not combine with parallel
# execution: tests sharing the session page may interfere with each other.
notion.tests.run.same.page=true
#
# When enabled, the test session page is moved to trash once the test run finishes.
# Disabled by default so pages of failed runs stay inspectable.
# notion.tests.session.cleanup=true
